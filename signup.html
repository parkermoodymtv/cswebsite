<body>
	<div class="popout">
		<form>
			<h2>Signup for All YOU Can Eat</h2>
			<label for="fname">First name:</label>
			<input type="text" id="fname" name="fname"><br>

			<label for="lname">Last name:</label>
			<input type="text" id="lname" name="lname"><br>

			<label for="acount">Adult tickets:</label>
			<input type="number" id="acount" name="acount" value="0"><br>

			<label for="ccount">Child tickets:</label>
			<input type="number" id="ccount" name="ccount" value="0"><br>

			<label for="scount">Senior tickets:</label>
			<input type="number" id="scount" name="scount" value="0"><br>

			<input type="submit" value="Submit"><br>
		</form>
		<h3 id="thanks"></h3>
		<a id="returnhome" href="index.html" style="text-decoration:none" hidden>
			<h1 class="button" id="homebutton">Return Home</h1>
		</a>
